<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adaptive Learning Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            text-align: center;
            font-size: 2em;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 1em;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .subject-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .subject-btn {
            padding: 20px;
            border: 2px solid #ddd;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: 600;
            transition: all 0.3s ease;
            color: #333;
        }

        .subject-btn:hover {
            border-color: #667eea;
            background: #f0f4ff;
            transform: translateY(-5px);
        }

        .subject-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .difficulty-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .difficulty-btn {
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s ease;
            color: #333;
        }

        .difficulty-btn:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .difficulty-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .question-box {
            background: #f9f9f9;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .question-text {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .options {
            display: grid;
            gap: 10px;
        }

        .option-btn {
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
            text-align: left;
            color: #333;
        }

        .option-btn:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .option-btn.correct {
            background: #4caf50;
            color: white;
            border-color: #4caf50;
        }

        .option-btn.incorrect {
            background: #f44336;
            color: white;
            border-color: #f44336;
        }

        .feedback {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 600;
            display: none;
        }

        .feedback.show {
            display: block;
        }

        .feedback.correct {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .feedback.incorrect {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .score-box {
            background: #667eea;
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
        }

        .score-box .score-value {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .score-box .score-label {
            font-size: 1em;
            opacity: 0.9;
        }

        .progress {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .progress-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ddd;
        }

        .progress-dot.active {
            background: #667eea;
        }

        .progress-dot.completed {
            background: #4caf50;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            border: 2px solid #ddd;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .results {
            text-align: center;
        }

        .results h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        .results-stat {
            background: #f9f9f9;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 10px;
            font-size: 1.2em;
            color: #333;
        }

        .results-stat .label {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .results-stat .value {
            font-weight: bold;
            color: #667eea;
            font-size: 1.5em;
        }

        .button-group.full {
            grid-template-columns: 1fr;
        }

        @media (max-width: 768px) {
            body { padding: 16px 12px; }
            .container { padding: 24px 18px; }
            .subject-grid, .difficulty-grid, .button-group { gap: 12px; }
            .question-box { padding: 22px 18px; }
            .question-text { font-size: 1.1em; }
        }

        @media (max-width: 480px) {
            .container { padding: 18px 14px; }
            h1 { font-size: 1.5em; }
            .subject-grid, .difficulty-grid, .button-group { grid-template-columns: 1fr; }
            .score-box { padding: 16px; }
            .score-box .score-value { font-size: 2em; }
            .btn { padding: 12px 16px; font-size: 1em; }
            .option-btn, .subject-btn, .difficulty-btn { font-size: 1em; padding: 14px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Adaptive Learning Game</h1>
        <p class="subtitle">Learn by doing - Practice what you struggle with!</p>

        <!-- Subject Selection Screen -->
        <div id="subjectScreen" class="screen active">
            <p style="text-align: center; color: #666; margin-bottom: 20px;">Which subject do you want to improve?</p>
            <div class="subject-grid">
                <button class="subject-btn" onclick="selectSubject('arithmetic', this)">
                    🔢 Arithmetic
                </button>
                <button class="subject-btn" onclick="selectSubject('geography', this)">
                    🌍 Geography
                </button>
                <button class="subject-btn" onclick="selectSubject('space', this)">
                    🚀 Space
                </button>
                <button class="subject-btn" onclick="selectSubject('puzzle', this)">
                    🧩 Puzzle
                </button>
            </div>
        </div>

        <!-- Difficulty Selection Screen -->
        <div id="difficultyScreen" class="screen">
            <p style="text-align: center; color: #666; margin-bottom: 20px;">Choose your difficulty level:</p>
            <div class="difficulty-grid">
                <button class="difficulty-btn" onclick="selectDifficulty('easy', this)">
                    Easy
                </button>
                <button class="difficulty-btn" onclick="selectDifficulty('medium', this)">
                    Medium
                </button>
                <button class="difficulty-btn" onclick="selectDifficulty('hard', this)">
                    Hard
                </button>
            </div>
            <button class="btn btn-secondary full-width" onclick="goBackSubject()">← Back</button>
        </div>

        <!-- Game Screen -->
        <div id="gameScreen" class="screen">
            <div class="progress" id="progressDots"></div>
            <div class="score-box">
                <div class="score-label">Score</div>
                    <div class="score-value" id="scoreValue" aria-live="polite">0</div>
            </div>
            <div class="question-box">
                <div class="question-text" id="questionText"></div>
                <div class="feedback" id="feedback" role="status" aria-live="assertive"></div>
                <div class="options" id="optionsContainer"></div>
            </div>
            <button class="btn btn-primary full-width" id="nextBtn" onclick="nextQuestion()" style="display: none;">
                Next Question →
            </button>
        </div>

        <!-- Results Screen -->
        <div id="resultsScreen" class="screen">
            <div class="results">
                <h2>🎉 Game Complete!</h2>
                <div class="results-stat">
                    <div class="label">Final Score</div>
                    <div class="value" id="finalScore">0/0</div>
                </div>
                <div class="results-stat">
                    <div class="label">Accuracy</div>
                    <div class="value" id="accuracy">0%</div>
                </div>
                <div class="button-group full">
                    <button class="btn btn-primary" onclick="playAgain()">Play Again 🔄</button>
                    <button class="btn btn-secondary" onclick="changeSubject()">Change Subject 🔀</button>
                </div>
            </div>
        </div>
    </div>

    <script src="adaptive-game.js"></script>
  <script src="nav-controls.js"></script>
</body>
</html>
