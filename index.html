<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Quiz Master - Adaptive quizzes for Grade 7 students with Math & Science themes">
    <meta name="keywords" content="quiz, grade 7, math, science, astronomy, biology, chemistry, physics">
    <meta name="theme-color" content="#0a0e27">
    <title>Quiz Master - Learning Hub</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1a3e 25%, #0d1b4f 50%, #1a0f3e 75%, #0a0e27 100%);
            color: #e6f3ff;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .header-nav {
            text-align: center;
            margin-bottom: 30px;
        }

        .header-nav a {
            display: inline-block;
            margin-bottom: 15px;
            padding: 10px 20px;
            background: rgba(0, 212, 255, 0.2);
            border: 1px solid #00d4ff;
            border-radius: 5px;
            color: #00d4ff;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .header-nav a:hover {
            background: rgba(0, 212, 255, 0.4);
            transform: translateY(-2px);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(15, 23, 42, 0.8);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }

        h1 {
            text-align: center;
            font-size: 2.5em;
            margin: 0 0 20px 0;
            background: linear-gradient(135deg, #00d4ff, #7dd3fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .controls-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
            padding-bottom: 30px;
            border-bottom: 1px solid rgba(0, 212, 255, 0.2);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-group label {
            font-size: 0.9em;
            color: #7dd3fc;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .control-group select,
        .control-group input {
            padding: 10px;
            background: rgba(30, 40, 70, 0.9);
            border: 1px solid #00d4ff;
            border-radius: 5px;
            color: #e6f3ff;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .control-group select:focus,
        .control-group input:focus {
            outline: none;
            border-color: #7dd3fc;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
        }

        .control-group select option {
            background: #1a1a3e;
            color: #e6f3ff;
        }

        .toggle-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toggle-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .theme-note {
            grid-column: 1 / -1;
            padding: 15px;
            background: rgba(0, 212, 255, 0.1);
            border-left: 3px solid #00d4ff;
            border-radius: 5px;
            color: #7dd3fc;
            font-size: 0.95em;
            font-style: italic;
        }

        .question-section {
            background: rgba(30, 40, 70, 0.6);
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
            border: 1px solid rgba(0, 212, 255, 0.2);
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(0, 212, 255, 0.2);
        }

        .question-counter {
            color: #00d4ff;
            font-weight: bold;
            font-size: 1.1em;
        }

        .question-text {
            font-size: 1.3em;
            color: #e6f3ff;
            margin-bottom: 25px;
            line-height: 1.5;
            font-weight: 500;
        }

        .choices {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .choice {
            padding: 15px;
            background: rgba(30, 40, 70, 0.8);
            border: 2px solid rgba(0, 212, 255, 0.3);
            border-radius: 8px;
            color: #e6f3ff;
            cursor: pointer;
            font-size: 1em;
            font-weight: 500;
            transition: all 0.3s ease;
            text-align: left;
        }

        .choice:hover {
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.15);
            transform: translateY(-2px);
        }

        .choice:focus {
            outline: none;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.5);
        }

        .choice.correct {
            background: rgba(34, 197, 94, 0.3);
            border-color: #22c55e;
            color: #86efac;
        }

        .choice.incorrect {
            background: rgba(239, 68, 68, 0.3);
            border-color: #ef4444;
            color: #fca5a5;
        }

        .choice.dim {
            opacity: 0.5;
            pointer-events: none;
        }

        .answer {
            padding: 15px;
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid #22c55e;
            border-radius: 5px;
            color: #86efac;
            font-weight: bold;
            display: none;
        }

        .answer[aria-hidden="false"] {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .button-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }

        button {
            padding: 12px 20px;
            background: linear-gradient(135deg, #00d4ff, #7dd3fc);
            color: #0a0e27;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95em;
            transition: all 0.3s ease;
        }

        button:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 212, 255, 0.3);
        }

        button:active:not(:disabled) {
            transform: translateY(-1px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .tutor-section {
            background: rgba(30, 40, 70, 0.6);
            padding: 25px;
            border-radius: 10px;
            border: 1px solid rgba(0, 212, 255, 0.2);
            margin-top: 30px;
        }

        .tutor-section h3 {
            color: #00d4ff;
            margin-top: 0;
            font-size: 1.3em;
        }

        .tutor-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tutor-input-group input {
            flex: 1;
            padding: 12px;
            background: rgba(30, 40, 70, 0.9);
            border: 1px solid #00d4ff;
            border-radius: 5px;
            color: #e6f3ff;
            font-size: 1em;
        }

        .tutor-input-group input:focus {
            outline: none;
            border-color: #7dd3fc;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
        }

        .tutor-input-group button {
            padding: 12px 25px;
        }

        .tutor-reply {
            padding: 20px;
            background: rgba(0, 212, 255, 0.1);
            border-left: 3px solid #00d4ff;
            border-radius: 5px;
            margin-bottom: 20px;
            min-height: 60px;
            color: #7dd3fc;
            line-height: 1.6;
        }

        .tutor-game {
            background: rgba(30, 40, 70, 0.8);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid rgba(0, 212, 255, 0.2);
        }

        .tutor-game .feedback {
            margin-bottom: 15px;
            color: #e6f3ff;
            font-weight: 500;
            font-size: 1.05em;
        }

        .tutor-game button {
            display: block;
            width: 100%;
            text-align: left;
            margin-bottom: 10px;
            padding: 15px;
            background: rgba(0, 212, 255, 0.2);
            border: 1px solid #00d4ff;
            color: #00d4ff;
            text-transform: none;
            letter-spacing: normal;
            transition: all 0.3s ease;
        }

        .tutor-game button:hover:not(:disabled) {
            background: rgba(0, 212, 255, 0.4);
            transform: none;
        }

        .tutor-game button:disabled {
            opacity: 0.6;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.8em;
            }

            .controls-section {
                grid-template-columns: 1fr;
            }

            .choices {
                grid-template-columns: 1fr;
            }

            .question-section {
                padding: 15px;
            }

            .button-group {
                grid-template-columns: 1fr;
            }
        }

        /* Celebration Effects */
        .celebration-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #00d4ff;
            animation: confettiFall 3s ease-out forwards;
        }

        @keyframes confettiFall {
            to {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        .firework {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            animation: fireworkExplode 1.5s ease-out forwards;
        }

        @keyframes fireworkExplode {
            to {
                transform: translate(var(--tx), var(--ty));
                opacity: 0;
            }
        }

        .celebration-text {
            position: fixed;
            font-size: 2em;
            font-weight: bold;
            pointer-events: none;
            z-index: 9998;
            animation: celebrationBounce 1.5s ease-out forwards;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.8);
        }

        @keyframes celebrationBounce {
            0% {
                transform: scale(0) rotate(0deg);
                opacity: 1;
            }
            50% {
                transform: scale(1.2) rotate(5deg);
            }
            100% {
                transform: scale(0.5) translateY(-200px) rotate(360deg);
                opacity: 0;
            }
        }

        .celebration-star {
            position: absolute;
            font-size: 1.5em;
            animation: starSpin 1.5s ease-out forwards;
        }

        @keyframes starSpin {
            0% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: scale(0) rotate(720deg) translateY(-150px);
                opacity: 0;
            }
        }

        .pulse-glow {
            animation: pulseGlow 0.6s ease-out;
        }

        @keyframes pulseGlow {
            0% {
                box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
            }
            100% {
                box-shadow: 0 0 0 30px rgba(34, 197, 94, 0);
            }
        }
    </style>
</head>
<body>
    <div id="celebrationContainer" class="celebration-container"></div>
    <div class="header-nav">
        <a href="home.html">← Back to Learning Hub</a>
    </div>

    <div class="container">
        <h1>🎯 Quiz Master</h1>

        <!-- Controls Section -->
        <div class="controls-section">
            <div class="control-group">
                <label for="gradeSelect">Grade Level</label>
                <select id="gradeSelect">
                    <option value="7">Grade 7</option>
                </select>
            </div>

            <div class="control-group">
                <label for="subjectSelect">Subject</label>
                <select id="subjectSelect">
                    <option value="math">📐 Math</option>
                    <option value="science">🧪 Science</option>
                    <option value="english">📚 English</option>
                    <option value="socialscience">🌍 Social Science</option>
                </select>
            </div>

            <div class="control-group" id="scienceThemeLabel" style="display: none;">
                <label for="scienceThemeSelect">Science Theme</label>
                <select id="scienceThemeSelect">
                    <option value="astronomy">🌌 Astronomy</option>
                    <option value="biology">🧬 Biology</option>
                    <option value="chemistry">⚗️ Chemistry</option>
                    <option value="physics">⚡ Physics</option>
                </select>
            </div>

            <div class="control-group">
                <label for="totalInput">Total Questions</label>
                <input type="number" id="totalInput" value="10" min="1" max="50">
            </div>

            <div class="control-group">
                <label for="intervalInput">Auto-advance Interval (seconds)</label>
                <input type="number" id="intervalInput" value="8" min="3" max="60">
            </div>

            <div class="control-group">
                <label for="autoToggle" class="toggle-group">
                    <input type="checkbox" id="autoToggle">
                    <span>Auto-advance</span>
                </label>
            </div>

            <div id="themeNote" class="theme-note">
                Pick a grade, subject, and (for science) a theme to get started!
            </div>
        </div>

        <!-- Question Section -->
        <div class="question-section">
            <div class="question-header">
                <div class="question-counter">
                    Question <span id="qIndex">1</span> of <span id="qCount">10</span>
                </div>
            </div>

            <div class="question-text" id="questionText">
                Select a grade and subject to begin.
            </div>

            <div class="choices" id="choices"></div>

            <div class="answer" id="answer" aria-hidden="true"></div>

            <div class="button-group">
                <button id="prevBtn">⬅️ Previous</button>
                <button id="nextBtn">Next ➡️</button>
                <button id="showAnswerBtn">Show Answer</button>
                <button id="shuffleBtn">Shuffle</button>
                <button id="randomBtn">Random</button>
            </div>
        </div>

        <!-- Tutor Section -->
        <div class="tutor-section">
            <h3>📚 Ask the Tutor</h3>
            <p>Have a question? Ask your tutor for help with any topic!</p>
            
            <div class="tutor-input-group">
                <input type="text" id="tutorQuestionInput" placeholder="Ask a question (e.g., 'What is photosynthesis?')">
                <button id="tutorAskBtn">Teach Me</button>
            </div>

            <div class="tutor-reply" id="tutorReply"></div>

            <div class="tutor-game" id="tutorGame"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
