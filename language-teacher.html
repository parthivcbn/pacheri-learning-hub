<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Teacher</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1a3e 25%, #0d1b4f 50%, #1a0f3e 75%, #0a0e27 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Starfield background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 60px 70px, #eee, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 50px 50px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 130px 80px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90px 10px, #ddd, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            opacity: 0.85;
            animation: twinkleSky 8s ease-in-out infinite;
            z-index: 1;
        }

        @keyframes twinkleSky {
            0%, 100% { opacity: 0.75; }
            50% { opacity: 1; }
        }

        /* Animated nebula clouds */
        body::after {
            content: '';
            position: fixed;
            top: -30%;
            left: -20%;
            width: 700px;
            height: 700px;
            background: radial-gradient(ellipse at 30% 40%, rgba(150, 100, 255, 0.12), transparent 50%),
                        radial-gradient(ellipse at 70% 60%, rgba(100, 200, 255, 0.1), transparent 45%);
            border-radius: 50%;
            filter: blur(100px);
            animation: nebulaDrift 20s ease-in-out infinite;
            pointer-events: none;
            z-index: 2;
        }

        @keyframes nebulaDrift {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(40px, -60px); }
        }

        .container {
            background: rgba(15, 23, 42, 0.85);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            padding: 40px;
            max-width: 700px;
            width: 100%;
            position: relative;
            z-index: 10;
            border: 1px solid rgba(0, 212, 255, 0.2);
            backdrop-filter: blur(10px);
        }

        h1 {
            background: linear-gradient(135deg, #00d4ff, #7dd3fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            text-align: center;
            font-size: 2em;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            padding: 8px 16px;
            background: rgba(0, 212, 255, 0.2);
            border: 1px solid #00d4ff;
            border-radius: 5px;
            color: #00d4ff;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            background: rgba(0, 212, 255, 0.4);
            transform: translateY(-2px);
        }

        .subtitle {
            color: #7dd3fc;
            text-align: center;
            margin-bottom: 30px;
            font-size: 1em;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .language-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .language-btn {
            padding: 20px;
            border: 2px solid #00d4ff;
            border-radius: 10px;
            background: rgba(30, 40, 70, 0.8);
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s ease;
            color: #7dd3fc;
        }

        .language-btn:hover {
            border-color: #7dd3fc;
            background: rgba(0, 212, 255, 0.2);
            transform: translateY(-5px);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }

        .language-btn.active {
            background: rgba(0, 212, 255, 0.3);
            color: #fff;
            border-color: #7dd3fc;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
        }

        .mode-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .mode-btn {
            padding: 15px;
            border: 2px solid #00d4ff;
            border-radius: 10px;
            background: rgba(30, 40, 70, 0.8);
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s ease;
            color: #7dd3fc;
        }

        .mode-btn:hover {
            border-color: #7dd3fc;
            background: rgba(0, 212, 255, 0.2);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
        }

        .mode-btn.active {
            background: rgba(0, 212, 255, 0.3);
            color: #fff;
            border-color: #7dd3fc;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.4);
        }

        .difficulty-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .difficulty-btn {
            padding: 15px;
            border: 2px solid #00d4ff;
            border-radius: 10px;
            background: rgba(30, 40, 70, 0.8);
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s ease;
            color: #7dd3fc;
        }

        .difficulty-btn:hover {
            border-color: #7dd3fc;
            background: rgba(0, 212, 255, 0.2);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
        }

        .difficulty-btn.active {
            background: rgba(0, 212, 255, 0.3);
            color: #fff;
            border-color: #7dd3fc;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.4);
        }

        .lesson-box {
            background: rgba(30, 40, 70, 0.7);
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 20px;
            text-align: center;
            min-height: 250px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border: 1px solid rgba(0, 212, 255, 0.2);
        }

        .lesson-label {
            font-size: 0.9em;
            color: #00d4ff;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .english-text {
            font-size: 1.3em;
            color: #7dd3fc;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .target-text {
            font-size: 2.2em;
            color: #00d4ff;
            margin-bottom: 10px;
            font-weight: bold;
            word-break: break-word;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }

        .pronunciation {
            font-size: 1.1em;
            color: #7dd3fc;
            margin-bottom: 20px;
            font-style: italic;
        }

        .explanation {
            background: rgba(0, 212, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            border-left: 3px solid #00d4ff;
            font-size: 0.95em;
            color: #7dd3fc;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .options {
            display: grid;
            gap: 10px;
            margin-bottom: 20px;
        }

        .option-btn {
            padding: 15px;
            border: 2px solid #00d4ff;
            border-radius: 10px;
            background: rgba(30, 40, 70, 0.8);
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
            text-align: left;
            color: #7dd3fc;
        }

        .option-btn:hover {
            border-color: #7dd3fc;
            background: rgba(0, 212, 255, 0.2);
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.2);
        }

        .option-btn.correct {
            background: rgba(76, 175, 80, 0.3);
            color: #4caf50;
            border-color: #4caf50;
            box-shadow: 0 0 10px rgba(76, 175, 80, 0.3);
        }

        .option-btn.incorrect {
            background: rgba(244, 67, 54, 0.3);
            color: #f44336;
            border-color: #f44336;
            box-shadow: 0 0 10px rgba(244, 67, 54, 0.3);
        }

        .feedback {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 600;
            display: none;
            border-left: 3px solid;
        }

        .feedback.show {
            display: block;
        }

        .feedback.correct {
            background: rgba(76, 175, 80, 0.2);
            color: #4caf50;
            border-color: #4caf50;
        }

        .feedback.incorrect {
            background: rgba(244, 67, 54, 0.2);
            color: #f44336;
            border-color: #f44336;
        }

        .score-box {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.2), rgba(125, 211, 252, 0.1));
            color: #7dd3fc;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
            border: 1px solid #00d4ff;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
        }

        .score-box .score-value {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 5px;
            color: #00d4ff;
        }

        .score-box .score-label {
            font-size: 1em;
            opacity: 0.9;
        }

        .progress {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .progress-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(0, 212, 255, 0.3);
            border: 1px solid #00d4ff;
        }

        .progress-dot.active {
            background: #00d4ff;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        .progress-dot.completed {
            background: #4caf50;
            box-shadow: 0 0 10px rgba(76, 175, 80, 0.5);
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.3), rgba(125, 211, 252, 0.2));
            color: #7dd3fc;
            border: 2px solid #00d4ff;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.2);
        }

        .btn-primary:hover {
            background: rgba(0, 212, 255, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
        }

        .btn-primary:disabled {
            background: rgba(100, 100, 100, 0.3);
            cursor: not-allowed;
            transform: none;
            border-color: #666;
        }

        .btn-secondary {
            background: rgba(30, 40, 70, 0.8);
            color: #7dd3fc;
            border: 2px solid #00d4ff;
        }

        .btn-secondary:hover {
            background: rgba(0, 212, 255, 0.2);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .results {
            text-align: center;
        }

        .results h2 {
            background: linear-gradient(135deg, #00d4ff, #7dd3fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        .results-stat {
            background: rgba(30, 40, 70, 0.7);
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 10px;
            font-size: 1.2em;
            color: #7dd3fc;
            border: 1px solid rgba(0, 212, 255, 0.2);
        }

        .results-stat .label {
            color: #00d4ff;
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .results-stat .value {
            font-weight: bold;
            color: #00d4ff;
            font-size: 1.5em;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
        }

        p[style*="text-align: center"] {
            color: #7dd3fc;
        }

        @media (max-width: 768px) {
            body { padding: 16px 12px; }
            .container { padding: 24px 18px; }
            .language-grid, .difficulty-grid, .mode-grid, .button-group { gap: 12px; }
            .lesson-box { padding: 22px 18px; }
            .target-text { font-size: 1.8em; }
        }

        @media (max-width: 480px) {
            .container { padding: 18px 14px; }
            h1 { font-size: 1.5em; }
            .language-grid, .difficulty-grid, .mode-grid, .button-group { grid-template-columns: 1fr; }
            .score-box { padding: 16px; }
            .score-box .score-value { font-size: 2em; }
            .btn { padding: 12px 16px; font-size: 1em; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌍 Language Teacher</h1>
        <p class="subtitle">Learn any language the easy way!</p>

        <!-- Language Selection Screen -->
        <div id="languageScreen" class="screen active">
            <p style="text-align: center; color: #666; margin-bottom: 20px;">Choose a language to learn:</p>
            <div class="language-grid" id="languageGrid"></div>
            <button class="btn btn-secondary full-width" onclick="goHome()">← Back to Home</button>
        </div>

        <!-- Mode Selection Screen -->
        <div id="modeScreen" class="screen">
            <p style="text-align: center; color: #666; margin-bottom: 20px;">Choose a learning mode:</p>
            <div class="mode-grid">
                <button class="mode-btn" onclick="selectMode('learn', this)">📚 Learn</button>
                <button class="mode-btn" onclick="selectMode('quiz', this)">❓ Quiz</button>
            </div>
            <button class="btn btn-secondary full-width" onclick="goBack()">← Back</button>
        </div>

        <!-- Difficulty Selection Screen -->
        <div id="difficultyScreen" class="screen">
            <p style="text-align: center; color: #666; margin-bottom: 20px;">Choose difficulty level:</p>
            <div class="difficulty-grid">
                <button class="difficulty-btn" onclick="selectDifficulty('beginner', this)">Beginner</button>
                <button class="difficulty-btn" onclick="selectDifficulty('intermediate', this)">Intermediate</button>
                <button class="difficulty-btn" onclick="selectDifficulty('advanced', this)">Advanced</button>
            </div>
            <button class="btn btn-secondary full-width" onclick="goBack()">← Back</button>
        </div>

        <!-- Learn Mode Screen -->
        <div id="learnScreen" class="screen">
            <div class="progress" id="progressDots"></div>
            <div class="score-box" id="studyProgressBox" style="margin-bottom: 16px;">
                <div class="score-label">Study Progress</div>
                <div class="score-value" id="studyProgressValue">0/0</div>
            </div>
            <div class="lesson-box" id="lessonCard">
                <div class="lesson-label">Lesson <span id="currentLesson">1</span> of <span id="totalLessons">8</span></div>
                <div class="english-text" id="englishText"></div>
                <div class="target-text" id="targetText"></div>
                <div class="pronunciation" id="pronunciation"></div>
                <div class="explanation" id="explanation"></div>
            </div>
            <div class="button-group">
                <button class="btn btn-secondary" onclick="previousLesson()" id="prevBtn">← Previous</button>
                <button class="btn btn-secondary" onclick="pronounceCurrentLesson()" id="pronounceBtn">🔊 Pronounce</button>
                <button class="btn btn-secondary" onclick="toggleFlashcard()" id="flashcardBtn">🃏 Flashcard</button>
                <button class="btn btn-primary" onclick="markLessonKnown()" id="knownBtn">✅ Mark known</button>
            </div>
            <div class="button-group" style="margin-top: 12px;">
                <button class="btn btn-primary full-width" onclick="nextLesson()" id="nextBtn">Next →</button>
            </div>
        </div>

        <!-- Quiz Mode Screen -->
        <div id="quizScreen" class="screen">
            <div class="progress" id="quizProgressDots"></div>
            <div class="score-box">
                <div class="score-label">Score</div>
                <div class="score-value" id="quizScore">0</div>
            </div>
            <div class="lesson-box">
                <div class="english-text" id="quizQuestion"></div>
                <div class="feedback" id="feedback" role="status" aria-live="assertive"></div>
                <div class="options" id="optionsContainer"></div>
            </div>
            <button class="btn btn-primary full-width" id="nextQuestionBtn" onclick="nextQuestion()" style="display: none;">
                Next Question →
            </button>
        </div>

        <!-- Results Screen -->
        <div id="resultsScreen" class="screen">
            <div class="results">
                <h2>🎉 Great Job!</h2>
                <div class="results-stat">
                    <div class="label">Your Score</div>
                    <div class="value" id="finalScore">0/0</div>
                </div>
                <div class="results-stat">
                    <div class="label">Accuracy</div>
                    <div class="value" id="accuracy">0%</div>
                </div>
                <div class="button-group full">
                    <button class="btn btn-primary" onclick="playAgain()">Play Again 🔄</button>
                    <button class="btn btn-secondary" onclick="changeLanguage()">Change Language 🔀</button>
                </div>
            </div>
        </div>
    </div>

    <script src="language-teacher.js"></script>
    <script src="nav-controls.js"></script>
</body>
</html>
