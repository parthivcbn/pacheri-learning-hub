<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Map Pointer Challenge | Parthiv Learning Hub</title>
  <meta name="description" content="Practice Earth and space locations in a friendly interactive map challenge." />
  <meta name="author" content="Parthiv" />
  <meta name="application-name" content="Parthiv Learning Hub" />
  <meta name="theme-color" content="#0a0e27" />
  <link rel="canonical" href="https://parthivcbn.github.io/pacheri-learning-hub/map-point.html" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <style>
    :root {
      --bg: #0f172a;
      --panel: rgba(15, 23, 42, 0.7);
      --panel-strong: #111827;
      --accent: #7dd3fc;
      --accent-2: #34d399;
      --danger: #f87171;
      --warning: #fbbf24;
      --text: #e2e8f0;
      --muted: #cbd5e1;
      --card: rgba(30, 41, 59, 0.9);
      --shadow: rgba(15, 23, 42, 0.45);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #020817 0%, #111827 30%, #1e293b 100%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .game-shell {
      width: min(1100px, 100%);
      background: rgba(15, 23, 42, 0.72);
      border: 1px solid rgba(125, 211, 252, 0.25);
      border-radius: 22px;
      box-shadow: 0 25px 60px var(--shadow);
      overflow: hidden;
      backdrop-filter: blur(8px);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 22px;
      background: rgba(15, 23, 42, 0.9);
      border-bottom: 1px solid rgba(125, 211, 252, 0.2);
    }

    .top-bar h1 {
      margin: 0;
      font-size: clamp(1.5rem, 3vw, 2.4rem);
    }

    .header-link {
      color: var(--accent);
      text-decoration: none;
      font-weight: 700;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(125, 211, 252, 0.1);
      border: 1px solid rgba(125, 211, 252, 0.2);
    }

    .panel {
      display: none;
      padding: 28px 22px 30px;
    }

    .panel.active {
      display: block;
    }

    .center-box {
      text-align: center;
      max-width: 700px;
      margin: 0 auto;
    }

    .subhead {
      color: var(--muted);
      font-size: 1.05rem;
      margin-bottom: 24px;
    }

    .map-choice-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
      margin-top: 18px;
    }

    .map-choice {
      border: 1px solid rgba(125, 211, 252, 0.25);
      background: linear-gradient(135deg, rgba(59,130,246,0.15), rgba(16,185,129,0.12));
      color: var(--text);
      border-radius: 18px;
      padding: 22px 18px;
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .map-choice:hover {
      transform: translateY(-2px);
      border-color: rgba(125, 211, 252, 0.6);
    }

    .map-choice .mini {
      display: block;
      font-size: 0.9rem;
      margin-top: 8px;
      color: var(--muted);
      font-weight: 500;
    }

    .game-layout {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 20px;
      align-items: start;
    }

    .question-panel,
    .score-panel {
      background: var(--card);
      border: 1px solid rgba(125, 211, 252, 0.18);
      border-radius: 18px;
      padding: 18px;
    }

    .question-label {
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 700;
      font-size: 0.75rem;
      margin-bottom: 10px;
    }

    .question-text {
      font-size: clamp(1.1rem, 2vw, 1.6rem);
      line-height: 1.4;
      margin: 0 0 18px;
      min-height: 56px;
    }

    .map-surface {
      position: relative;
      width: 100%;
      min-height: 420px;
      border-radius: 18px;
      border: 1px solid rgba(125, 211, 252, 0.2);
      overflow: hidden;
      background: linear-gradient(180deg, rgba(14, 116, 144, 0.42), rgba(15, 23, 42, 0.9));
    }

    .earth-map {
      background: linear-gradient(180deg, rgba(8,47,73,0.95), rgba(15,23,42,0.98));
    }

    .earth-map::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 18% 22%, rgba(255,255,255,0.17), transparent 18%),
        radial-gradient(circle at 70% 25%, rgba(255,255,255,0.12), transparent 16%),
        radial-gradient(circle at 40% 70%, rgba(255,255,255,0.1), transparent 20%);
      pointer-events: none;
    }

    .earth-map.reference-map {
      background-color: #dff5ff;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .earth-map .continent-shape {
      fill: rgba(22,163,74,0.9);
      stroke: rgba(220,252,231,0.9);
      stroke-width: 2.4;
    }

    .space-map {
      background: radial-gradient(circle at center, rgba(37,99,235,0.22), rgba(2,6,23,0.92));
    }

    .space-map::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(2px 2px at 10% 25%, #fff, transparent),
        radial-gradient(2px 2px at 22% 30%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 35% 18%, #fff, transparent),
        radial-gradient(2px 2px at 62% 26%, #fff, transparent),
        radial-gradient(2px 2px at 78% 18%, #fff, transparent),
        radial-gradient(2px 2px at 88% 34%, #fff, transparent),
        radial-gradient(2px 2px at 53% 12%, #fff, transparent),
        radial-gradient(2px 2px at 72% 60%, #fff, transparent),
        radial-gradient(2px 2px at 26% 72%, #fff, transparent),
        radial-gradient(2px 2px at 14% 52%, #fff, transparent);
      opacity: 0.9;
      pointer-events: none;
    }

    .world-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 0;
    }

    .continent-shape {
      fill: rgba(34,197,94,0.9);
      stroke: rgba(220,252,231,0.9);
      stroke-width: 2;
      filter: drop-shadow(0 6px 12px rgba(16,185,129,0.18));
    }

    .ocean-label {
      fill: rgba(191,219,254,0.9);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .hotspot {
      position: absolute;
      transform: translate(-50%, -50%);
      min-width: 80px;
      padding: 8px 10px;
      border: 2px solid rgba(125, 211, 252, 0.8);
      border-radius: 999px;
      background: rgba(14, 116, 144, 0.8);
      color: white;
      font-weight: 700;
      font-size: 0.72rem;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(59,130,246,0.3);
      transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
      z-index: 2;
    }

    .hotspot:hover:not(:disabled) {
      transform: translate(-50%, -50%) scale(1.06);
      border-color: #fff;
    }

    .hotspot.correct {
      background: rgba(34, 197, 94, 0.9);
      border-color: rgba(187, 247, 208, 0.9);
    }

    .hotspot.wrong {
      background: rgba(239, 68, 68, 0.88);
      border-color: rgba(254, 202, 202, 0.9);
    }

    .hotspot:disabled {
      cursor: default;
      opacity: 1;
    }

    .feedback {
      min-height: 52px;
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      font-weight: 700;
      display: none;
    }

    .feedback.success {
      display: block;
      color: #dcfce7;
      background: rgba(34, 197, 94, 0.18);
      border: 1px solid rgba(34, 197, 94, 0.4);
    }

    .feedback.error {
      display: block;
      color: #fee2e2;
      background: rgba(239, 68, 68, 0.14);
      border: 1px solid rgba(239, 68, 68, 0.4);
    }

    .controls {
      display: flex;
      justify-content: flex-start;
      margin-top: 16px;
      gap: 12px;
      flex-wrap: wrap;
    }

    button.primary, button.secondary {
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    button.primary {
      background: linear-gradient(135deg, #38bdf8, #2563eb);
      color: white;
    }

    button.secondary {
      background: rgba(148, 163, 184, 0.14);
      color: var(--text);
      border: 1px solid rgba(148, 163, 184, 0.3);
    }

    button.primary:hover, button.secondary:hover {
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .score-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 220px;
      justify-content: center;
    }

    .score-box {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--accent);
    }

    .score-mini {
      color: var(--muted);
      margin-top: 6px;
      line-height: 1.5;
    }

    .result-panel {
      max-width: 520px;
      margin: 0 auto;
      text-align: center;
    }

    .result-panel h2 {
      font-size: clamp(1.8rem, 3vw, 2.6rem);
      margin-bottom: 12px;
    }

    .result-panel p {
      color: var(--muted);
      font-size: 1.1rem;
      margin-bottom: 16px;
    }

    @media (max-width: 820px) {
      .game-layout {
        grid-template-columns: 1fr;
      }

      .map-surface {
        min-height: 310px;
      }
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <div class="top-bar">
      <h1>🗺️ Map Pointer Challenge</h1>
      <a class="header-link" href="home.html">← Learning Hub</a>
    </div>

    <section id="mapChoicePanel" class="panel active">
      <div class="center-box">
        <h2>Choose your map</h2>
        <p class="subhead">Pick Earth or Space. Then answer easy questions by tapping the correct place on the map.</p>
        <div class="map-choice-grid">
          <button class="map-choice" data-map="earth" type="button">
            🌍 Earth Map
            <span class="mini">Continents and places</span>
          </button>
          <button class="map-choice" data-map="space" type="button">
            🚀 Space Map
            <span class="mini">Planets and stars</span>
          </button>
        </div>
      </div>
    </section>

    <section id="gamePanel" class="panel">
      <div class="game-layout">
        <div class="question-panel">
          <div class="question-label" id="mapName">Earth Map</div>
          <div id="questionText" class="question-text">Loading question…</div>
          <div id="mapContainer" class="map-surface earth-map" aria-live="polite"></div>
          <div id="feedback" class="feedback" aria-live="polite"></div>
          <div class="controls">
            <button id="nextBtn" class="primary" type="button" disabled>Next Question</button>
            <button id="changeMapBtn" class="secondary" type="button">Change Map</button>
          </div>
        </div>

        <aside class="score-panel">
          <div class="question-label">Score</div>
          <div id="scoreValue" class="score-box">0</div>
          <div class="score-mini" id="progressText">Question 1 of 5</div>
        </aside>
      </div>
    </section>

    <section id="resultPanel" class="panel">
      <div class="result-panel">
        <h2>🌟 Round complete!</h2>
        <p id="resultText">You scored 0 out of 0.</p>
        <div class="controls" style="justify-content:center;">
          <button id="playAgainBtn" class="primary" type="button">Play Again</button>
          <button id="resultChangeMapBtn" class="secondary" type="button">Choose Another Map</button>
        </div>
      </div>
    </section>
  </div>

  <script src="map-point.js"></script>
</body>
</html>
