<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cosmic Puzzle Game</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #4facfe 75%, #00f2fe 100%);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      background: rgba(20, 10, 40, 0.9);
      border-radius: 30px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 50px rgba(138, 43, 226, 0.5);
      backdrop-filter: blur(10px);
      max-width: 500px;
      width: 100%;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    h1 {
      font-size: 40px;
      background: linear-gradient(135deg, #00f2fe, #4facfe, #f093fb);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
      text-shadow: 0 0 20px rgba(79, 172, 254, 0.3);
    }

    .subtitle {
      color: #a0aec0;
      font-size: 14px;
    }

    .game-board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin: 30px 0;
      background: rgba(10, 5, 20, 0.6);
      padding: 20px;
      border-radius: 20px;
      border: 2px solid rgba(100, 200, 255, 0.3);
    }

    .puzzle-tile {
      width: 100%;
      aspect-ratio: 1;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 32px;
      transition: all 0.3s ease;
      transform: scale(1);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .puzzle-tile:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(100, 200, 255, 0.5);
    }

    .puzzle-tile.matched {
      background: linear-gradient(135deg, #11e08d, #50d6a8);
      transform: scale(0.95);
      border-color: rgba(17, 224, 141, 0.6);
    }

    .puzzle-tile.flip {
      animation: flipTile 0.6s ease;
    }

    @keyframes flipTile {
      0% { transform: rotateY(0deg) scale(1); }
      50% { transform: rotateY(90deg) scale(1.1); }
      100% { transform: rotateY(0deg) scale(1); }
    }

    .stats {
      display: flex;
      justify-content: space-around;
      margin: 20px 0;
      background: rgba(100, 200, 255, 0.1);
      padding: 15px;
      border-radius: 12px;
      border: 1px solid rgba(100, 200, 255, 0.3);
    }

    .stat-item {
      text-align: center;
    }

    .stat-label {
      color: #a0aec0;
      font-size: 12px;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .stat-value {
      font-size: 24px;
      font-weight: bold;
      background: linear-gradient(135deg, #00f2fe, #4facfe, #f093fb);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .controls {
      display: flex;
      gap: 12px;
      margin-top: 30px;
    }

    button {
      flex: 1;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
    }

    .btn-secondary {
      background: linear-gradient(135deg, #f093fb, #f5576c);
      color: white;
      box-shadow: 0 4px 15px rgba(240, 147, 251, 0.4);
    }

    .btn-secondary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(240, 147, 251, 0.6);
    }

    .message {
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      margin-top: 20px;
      min-height: 30px;
      background: linear-gradient(135deg, #00f2fe, #4facfe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      opacity: 0;
      animation: fadeInOut 2s ease;
    }

    @keyframes fadeInOut {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }

    .message.show {
      opacity: 1;
    }

    .difficulty-select {
      margin-bottom: 20px;
      text-align: center;
    }

    .game-selector {
      margin-bottom: 20px;
      text-align: center;
      background: rgba(100, 150, 255, 0.1);
      padding: 15px;
      border-radius: 12px;
      border: 1px solid rgba(100, 200, 255, 0.2);
    }

    .game-selector-label {
      color: #a0aec0;
      font-size: 12px;
      text-transform: uppercase;
      margin-bottom: 10px;
      display: block;
      letter-spacing: 1px;
    }

    .game-btn {
      background: rgba(100, 200, 255, 0.2);
      color: #00f2fe;
      border: 2px solid rgba(100, 200, 255, 0.3);
      padding: 10px 18px;
      margin: 5px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: bold;
      font-size: 12px;
      display: inline-block;
    }

    .game-btn:hover,
    .game-btn.active {
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-color: #667eea;
      color: white;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .difficulty-btn {
      background: rgba(100, 200, 255, 0.2);
      color: #00f2fe;
      border: 2px solid rgba(100, 200, 255, 0.3);
      padding: 10px 20px;
      margin: 0 5px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: bold;
    }

    .difficulty-btn:hover,
    .difficulty-btn.active {
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-color: #667eea;
      color: white;
    }

    @media (max-width: 600px) {
      .container {
        padding: 20px;
      }

      h1 {
        font-size: 32px;
      }

      .game-board {
        grid-template-columns: repeat(3, 1fr);
      }

      .puzzle-tile {
        font-size: 24px;
      }
    }

    .kb-hint {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: rgba(20, 10, 40, 0.95);
      border: 1px solid rgba(100, 200, 255, 0.3);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 11px;
      color: #a0aec0;
      z-index: 20;
      backdrop-filter: blur(10px);
      line-height: 1.6;
    }

    .puzzle-tile.focused {
      border-color: rgba(0, 212, 255, 0.8);
      box-shadow: 0 0 15px rgba(0, 212, 255, 0.5);
      transform: scale(1.08);
    }
  </style>
</head>
<body class="no-global-scroll">
  <div class="container">
    <header>
      <h1>🎮 Cosmic Puzzle</h1>
      <div class="subtitle">Match pairs and solve the puzzle!</div>
    </header>

    <div class="game-selector">
      <span class="game-selector-label">Choose Game:</span>
      <button class="game-btn active" onclick="switchGame('cosmic')">🌌 Cosmic Puzzle</button>
      <button class="game-btn" onclick="switchGame('animals')">🦁 Animal Match</button>
      <button class="game-btn" onclick="switchGame('nature')">🌿 Nature Quest</button>
      <button class="game-btn" onclick="switchGame('food')">🍕 Food Frenzy</button>
      <button class="game-btn" onclick="switchGame('sports')">⚽ Sports Mix</button>
    </div>

    <div class="difficulty-select">
      <button class="difficulty-btn active" onclick="setDifficulty('easy')">Easy (8)</button>
      <button class="difficulty-btn" onclick="setDifficulty('medium')">Medium (12)</button>
      <button class="difficulty-btn" onclick="setDifficulty('hard')">Hard (16)</button>
      <button class="difficulty-btn" onclick="setDifficulty('extreme')">Extreme (20)</button>
      <button class="difficulty-btn" onclick="setDifficulty('master')">Master (24)</button>
    </div>

    <div class="stats">
      <div class="stat-item">
        <div class="stat-label">Moves</div>
        <div class="stat-value" id="moves">0</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Matches</div>
        <div class="stat-value" id="matches">0/4</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Score</div>
        <div class="stat-value" id="score">0</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Time</div>
        <div class="stat-value" id="time">0s</div>
      </div>
    </div>

    <div class="game-board" id="gameBoard"></div>

    <div class="message" id="message"></div>

    <div class="controls">
      <button class="btn-primary" onclick="newGame()">New Game</button>
      <button class="btn-secondary" onclick="resetGame()">Reset</button>
    </div>
  </div>

  <div class="kb-hint">
    <div>⬆️ ⬇️ ⬅️ ➡️ Navigate Tiles</div>
    <div>↵ Enter Click Tile • E/M/H/X/Z Difficulty</div>
  </div>

  <script>
    const gameThemes = {
      cosmic: {
        title: '🎮 Cosmic Puzzle',
        subtitle: 'Explore the universe with space emojis!',
        emojis: ['🌟', '🎆', '🌈', '☄️', '🪐', '🚀', '⭐', '✨', '🌠', '💫', '🛸', '🌙', '🪐', '🔭', '🌍', '🌎']
      },
      animals: {
        title: '🦁 Animal Match',
        subtitle: 'Match animal pairs!',
        emojis: ['🦁', '🐯', '🐻', '🐼', '🐨', '🐸', '🦜', '🦋', '🐬', '🦅', '🐢', '🦊', '🐰', '🐻‍❄️', '🦘', '🐧']
      },
      nature: {
        title: '🌿 Nature Quest',
        subtitle: 'Match nature and plants!',
        emojis: ['🌿', '🌲', '🌳', '🌴', '🌵', '🌾', '🌻', '🌺', '🌸', '🌼', '🍀', '🎋', '🌱', '🍃', '🌑', '🌙']
      },
      food: {
        title: '🍕 Food Frenzy',
        subtitle: 'Match delicious food items!',
        emojis: ['🍕', '🍔', '🍟', '🌮', '🍜', '🍱', '🍰', '🍪', '🍩', '🍫', '🍎', '🍌', '🍕', '🍖', '🥦', '🍓']
      },
      sports: {
        title: '⚽ Sports Mix',
        subtitle: 'Match sports and games!',
        emojis: ['⚽', '🏀', '🏈', '⚾', '🎾', '🏐', '🏓', '🏸', '🥊', '🤺', '🎣', '🚴', '🏌️', '⛷️', '🏂', '🛹']
      }
    };
    
    let emojis = gameThemes.cosmic.emojis;
    let currentGame = 'cosmic';
    
    let gameBoard = [];
    let flipped = [];
    let matched = [];
    let moves = 0;
    let gameStarted = false;
    let gameOver = false;
    let difficulty = 'easy';
    let timer = 0;
    var score = 0;
    let timerInterval = null;

    const difficultyLevels = {
      easy: 8,
      medium: 12,
      hard: 16,
      extreme: 20,
      master: 24
    };

    function setDifficulty(level) {
      difficulty = level;
      document.querySelectorAll('.difficulty-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      newGame();
    }

    function switchGame(gameType) {
      currentGame = gameType;
      const theme = gameThemes[gameType];
      emojis = theme.emojis;
      
      // Update header
      document.querySelector('h1').textContent = theme.title;
      document.querySelector('.subtitle').textContent = theme.subtitle;
      
      // Update active button
      document.querySelectorAll('.game-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      
      // Start new game
      newGame();
    }

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function newGame() {
      gameBoard = [];
      flipped = [];
      matched = [];
      moves = 0;
      gameStarted = false;
      gameOver = false;
      timer = 0;
      score = 0;
      document.getElementById('score').textContent = score;
      clearInterval(timerInterval);
      
      const tileCount = difficultyLevels[difficulty];
      const pairCount = tileCount / 2;
      const selectedEmojis = emojis.slice(0, pairCount);
      const pairs = [...selectedEmojis, ...selectedEmojis];
      
      gameBoard = shuffle(pairs);
      renderBoard();
      updateStats();
    }

    function renderBoard() {
      const boardEl = document.getElementById('gameBoard');
      boardEl.innerHTML = '';
      boardEl.style.gridTemplateColumns = `repeat(${Math.ceil(Math.sqrt(gameBoard.length))}, 1fr)`;
      
      gameBoard.forEach((emoji, index) => {
        const tile = document.createElement('div');
        tile.className = 'puzzle-tile';
        tile.textContent = matched.includes(index) ? emoji : '?';
        tile.style.background = matched.includes(index) 
          ? 'linear-gradient(135deg, #11e08d, #50d6a8)' 
          : 'linear-gradient(135deg, #667eea, #764ba2)';
        
        if (matched.includes(index)) {
          tile.classList.add('matched');
        }
        
        tile.onclick = () => flipTile(index, tile);
        boardEl.appendChild(tile);
      });
    }

    function flipTile(index, element) {
      if (!gameStarted) {
        gameStarted = true;
        timerInterval = setInterval(() => {
          timer++;
          document.getElementById('time').textContent = timer + 's';
        }, 1000);
      }

      if (matched.includes(index) || flipped.includes(index) || gameOver) return;

      flipped.push(index);
      element.classList.add('flip');
      element.textContent = gameBoard[index];
      element.style.background = 'linear-gradient(135deg, #00f2fe, #4facfe)';

      if (flipped.length === 2) {
        moves++;
        document.getElementById('moves').textContent = moves;

        if (gameBoard[flipped[0]] === gameBoard[flipped[1]]) {
          // Match found!
          matched.push(flipped[0], flipped[1]);
          flipped = [];
          score += 10;
          document.getElementById('score').textContent = score;
          
          document.getElementById('matches').textContent = matched.length / 2 + '/' + (gameBoard.length / 2);
          showMessage('🎉 Match Found!');

          if (matched.length === gameBoard.length) {
            gameOver = true;
            clearInterval(timerInterval);
            showMessage(`🏆 Victory! ${moves} moves, ${timer} seconds!`);
          }
        } else {
          // No match
          setTimeout(() => {
            const tiles = document.querySelectorAll('.puzzle-tile');
            tiles[flipped[0]].textContent = '?';
            tiles[flipped[0]].style.background = 'linear-gradient(135deg, #667eea, #764ba2)';
            tiles[flipped[0]].classList.remove('flip');
            
            tiles[flipped[1]].textContent = '?';
            tiles[flipped[1]].style.background = 'linear-gradient(135deg, #667eea, #764ba2)';
            tiles[flipped[1]].classList.remove('flip');
            
            flipped = [];
          }, 1000);
        }
      }
    }

    function resetGame() {
      newGame();
    }

    function updateStats() {
      document.getElementById('moves').textContent = '0';
      document.getElementById('matches').textContent = '0/' + (gameBoard.length / 2);
      document.getElementById('score').textContent = '0';
      document.getElementById('time').textContent = '0s';
    }

    function showMessage(text) {
      const msg = document.getElementById('message');
      msg.textContent = text;
      msg.classList.add('show');
      setTimeout(() => {
        msg.classList.remove('show');
      }, 2000);
    }

    // Start the game
    newGame();

    // Keyboard navigation for puzzle
    let focusedTile = 0;
    const cols = Math.ceil(Math.sqrt(gameBoard.length));

    function updateTileFocus() {
      document.querySelectorAll('.puzzle-tile').forEach(tile => tile.classList.remove('focused'));
      const tiles = document.querySelectorAll('.puzzle-tile');
      if (tiles[focusedTile]) {
        tiles[focusedTile].classList.add('focused');
        tiles[focusedTile].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    document.addEventListener('keydown', (e) => {
      const tiles = document.querySelectorAll('.puzzle-tile');
      const cols = Math.ceil(Math.sqrt(gameBoard.length));
      const row = Math.floor(focusedTile / cols);
      const col = focusedTile % cols;

      switch(e.key) {
        case 'ArrowUp':
          e.preventDefault();
          if (row > 0) focusedTile -= cols;
          updateTileFocus();
          break;

        case 'ArrowDown':
          e.preventDefault();
          if (row < Math.ceil(tiles.length / cols) - 1) focusedTile += cols;
          updateTileFocus();
          break;

        case 'ArrowLeft':
          e.preventDefault();
          if (focusedTile > 0) focusedTile--;
          updateTileFocus();
          break;

        case 'ArrowRight':
          e.preventDefault();
          if (focusedTile < tiles.length - 1) focusedTile++;
          updateTileFocus();
          break;

        case 'Enter':
          e.preventDefault();
          if (tiles[focusedTile]) {
            tiles[focusedTile].click();
          }
          break;

        case 'e':
        case 'E':
          e.preventDefault();
          setDifficulty('easy');
          break;

        case 'm':
        case 'M':
          e.preventDefault();
          setDifficulty('medium');
          break;

        case 'h':
        case 'H':
          e.preventDefault();
          setDifficulty('hard');
          break;

        case 'x':
        case 'X':
          e.preventDefault();
          setDifficulty('extreme');
          break;

        case 'z':
        case 'Z':
          e.preventDefault();
          setDifficulty('master');
          break;
      }
    });

    // Reset focus when new game starts
    const originalNewGame = newGame;
    newGame = function() {
      originalNewGame.call(this);
      focusedTile = 0;
      updateTileFocus();
    };

    updateTileFocus();
  </script>
  <script src="nav-controls.js"></script>
</body>
</html>
