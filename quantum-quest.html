<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Quantum Quest - The Ultimate Arcade Quiz ⚡</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #090a16;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .bg-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(123, 44, 191, 0.4) 0%, rgba(0, 240, 255, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
            filter: blur(50px);
            animation: pulseGlow 6s infinite alternate ease-in-out;
        }

        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.6; }
            100% { transform: translate(-50%, -50%) scale(1.3); opacity: 0.9; }
        }

        .quiz-card {
            position: relative;
            width: 90%;
            max-width: 550px;
            background: rgba(23, 22, 45, 0.85);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(0, 240, 255, 0.3);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(0, 240, 255, 0.2);
            transition: transform 0.2s ease;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 0.95rem;
        }

        .streak-badge {
            background: linear-gradient(135deg, #ff007f, #ffaa00);
            padding: 6px 14px;
            border-radius: 20px;
            color: #fff;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.6);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .score-box {
            color: #00f0ff;
            text-shadow: 0 0 8px #00f0ff;
            font-size: 1.1rem;
        }

        .timer-container {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .timer-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #00f0ff, #00ff66);
            transition: width 0.1s linear, background 0.3s;
            box-shadow: 0 0 10px #00f0ff;
        }

        .category-tag {
            display: inline-block;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ffaa00;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .question-text {
            font-size: 1.35rem;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 25px;
            color: #ffffff;
            min-height: 60px;
        }

        .choices-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .choice-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            color: #f0f0f0;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .choice-btn:hover:not(:disabled) {
            background: rgba(0, 240, 255, 0.15);
            border-color: #00f0ff;
            transform: translateX(5px);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.3);
        }

        .choice-btn.correct {
            background: rgba(0, 255, 102, 0.2) !important;
            border-color: #00ff66 !important;
            color: #00ff66 !important;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.5);
        }

        .choice-btn.incorrect {
            background: rgba(255, 0, 102, 0.2) !important;
            border-color: #ff0066 !important;
            color: #ff0066 !important;
            box-shadow: 0 0 15px rgba(255, 0, 102, 0.5);
        }

        .powerups-bar {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
        }

        .powerup-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .powerup-btn:hover:not(:disabled) {
            background: rgba(255, 170, 0, 0.2);
            border-color: #ffaa00;
        }

        .powerup-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 14, 30, 0.95);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            text-align: center;
            z-index: 10;
            transition: opacity 0.3s ease;
        }

        .overlay.hidden {
            display: none !important;
        }

        .title {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #00f0ff, #ff007f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
        }

        .subtitle {
            font-size: 1rem;
            color: #a0a5c0;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .action-btn {
            padding: 14px 32px;
            font-size: 1.1rem;
            font-weight: 700;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, #00f0ff, #7b2cbf);
            color: #ffffff;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .action-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(123, 44, 191, 0.8);
        }

        .float-score {
            position: absolute;
            font-weight: bold;
            font-size: 1.5rem;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            z-index: 20;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-40px) scale(1.4); }
        }

        @media (max-width: 480px) {
            .quiz-card { padding: 22px 18px; }
            .question-text { font-size: 1.15rem; }
            .title { font-size: 1.8rem; }
            .choice-btn { padding: 12px 14px; }
        }
    </style>
</head>
<body>
    <div class="bg-glow" aria-hidden="true"></div>

    <main class="quiz-card" id="quizCard">
        <div class="status-bar">
            <div class="score-box" id="scoreDisplay">SCORE: 0</div>
            <div class="streak-badge" id="streakDisplay">🔥 0 STREAK</div>
        </div>

        <div class="timer-container" role="progressbar" aria-label="Time remaining" aria-valuemin="0" aria-valuemax="100">
            <div class="timer-bar" id="timerBar"></div>
        </div>

        <div class="category-tag" id="categoryTag">GENERAL SCIENCE</div>
        <div class="question-text" id="questionText">Loading Quantum Question...</div>
        <div class="choices-grid" id="choicesGrid"></div>

        <div class="powerups-bar">
            <button class="powerup-btn" id="p5050" type="button" onclick="use5050()">⚡ 50:50</button>
            <button class="powerup-btn" id="pFreeze" type="button" onclick="useFreeze()">❄️ Freeze Time</button>
        </div>

        <div class="overlay" id="startOverlay">
            <div class="title">⚡ QUANTUM QUEST ⚡</div>
            <p class="subtitle">Test your speed &amp; brainpower!<br>Build high answer streaks for giant multiplier bonuses!</p>
            <button class="action-btn" type="button" onclick="startQuiz()">LAUNCH QUIZ</button>
        </div>

        <div class="overlay hidden" id="resultsOverlay" aria-live="polite">
            <div class="title" id="resultTitle">QUEST COMPLETE!</div>
            <p class="subtitle" id="resultText">You scored 0 points!</p>
            <button class="action-btn" type="button" onclick="startQuiz()">PLAY AGAIN</button>
        </div>
    </main>

    <script>
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        const audioCtx = AudioContextClass ? new AudioContextClass() : null;

        function playSound(type) {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.25);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(110, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'powerup') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            }
        }

        const quizBank = [
            { category: "SPACE & COSMOS", q: "What is the fastest moving object in the universe?", choices: ["Light", "Sound", "Solar Wind", "Neutron Star"], correct: 0 },
            { category: "TECH & AI", q: "Which programming language powers the dynamic client-side web?", choices: ["Python", "JavaScript", "C++", "Java"], correct: 1 },
            { category: "GAMING & POP CULTURE", q: "In gaming terminology, what does 'FPS' usually stand for?", choices: ["First Person Shooter", "Fast Player Speed", "Final Power State", "Frame Per Second"], correct: 0 },
            { category: "MIND BENDERS", q: "If a digital clock shows 3:15, what is the angle between the hands?", choices: ["0 degrees", "7.5 degrees", "15 degrees", "90 degrees"], correct: 1 },
            { category: "SCIENCE & PHYSICS", q: "What element has the chemical symbol 'Au'?", choices: ["Silver", "Gold", "Argon", "Copper"], correct: 1 },
            { category: "GEOGRAPHY & NATURE", q: "Which ocean is the largest on planet Earth?", choices: ["Atlantic", "Indian", "Arctic", "Pacific"], correct: 3 },
            { category: "SUPERHERO TRIVIA", q: "What metal is wrapped around Wolverine's skeleton?", choices: ["Vibranium", "Adamantium", "Kryptonite", "Titanium"], correct: 1 }
        ];

        let currentQIndex = 0;
        let score = 0;
        let streak = 0;
        let timerInterval;
        let timeLeft = 10;
        let isAnswered = false;
        let used5050 = false;
        let usedFreeze = false;

        const questionText = document.getElementById('questionText');
        const categoryTag = document.getElementById('categoryTag');
        const choicesGrid = document.getElementById('choicesGrid');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const streakDisplay = document.getElementById('streakDisplay');
        const timerBar = document.getElementById('timerBar');
        const startOverlay = document.getElementById('startOverlay');
        const resultsOverlay = document.getElementById('resultsOverlay');
        const resultTitle = document.getElementById('resultTitle');
        const resultText = document.getElementById('resultText');
        const p5050 = document.getElementById('p5050');
        const pFreeze = document.getElementById('pFreeze');

        function startQuiz() {
            clearInterval(timerInterval);
            score = 0;
            streak = 0;
            currentQIndex = 0;
            used5050 = false;
            usedFreeze = false;
            p5050.disabled = false;
            pFreeze.disabled = false;
            updateScoreUI();
            startOverlay.classList.add('hidden');
            resultsOverlay.classList.add('hidden');
            loadNextQuestion();
        }

        function loadNextQuestion() {
            if (currentQIndex >= quizBank.length) {
                endQuiz();
                return;
            }

            isAnswered = false;
            const currentQ = quizBank[currentQIndex];
            categoryTag.textContent = currentQ.category;
            questionText.textContent = currentQ.q;
            choicesGrid.innerHTML = '';

            currentQ.choices.forEach((choice, index) => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                const label = document.createElement('span');
                label.textContent = choice;
                const number = document.createElement('span');
                number.style.opacity = '0.4';
                number.textContent = `#${index + 1}`;
                btn.append(label, number);
                btn.type = 'button';
                btn.addEventListener('click', () => selectChoice(index, btn));
                choicesGrid.appendChild(btn);
            });

            startTimer();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 10;
            timerBar.style.width = '100%';
            timerBar.style.background = 'linear-gradient(90deg, #00f0ff, #00ff66)';
            timerBar.style.boxShadow = '0 0 10px #00f0ff';

            timerInterval = setInterval(() => {
                timeLeft = Math.max(0, timeLeft - 0.1);
                const percentage = (timeLeft / 10) * 100;
                timerBar.style.width = `${percentage}%`;
                timerBar.parentElement.setAttribute('aria-valuenow', String(Math.round(percentage)));

                if (timeLeft <= 3) timerBar.style.background = '#ff0066';
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleTimeout();
                }
            }, 100);
        }

        function selectChoice(selectedIndex, btnElement) {
            if (isAnswered) return;
            isAnswered = true;
            clearInterval(timerInterval);
            const currentQ = quizBank[currentQIndex];
            const allBtns = choicesGrid.querySelectorAll('.choice-btn');

            if (selectedIndex === currentQ.correct) {
                btnElement.classList.add('correct');
                playSound('correct');
                streak++;
                const pointsEarned = 100 + Math.floor(timeLeft * 10) + (streak * 20);
                score += pointsEarned;
                showFloatingText(`+${pointsEarned}`, btnElement, '#00ff66');
            } else {
                btnElement.classList.add('incorrect');
                allBtns[currentQ.correct].classList.add('correct');
                playSound('wrong');
                streak = 0;
            }

            allBtns.forEach(btn => btn.disabled = true);
            updateScoreUI();
            setTimeout(() => {
                currentQIndex++;
                loadNextQuestion();
            }, 1200);
        }

        function handleTimeout() {
            if (isAnswered) return;
            isAnswered = true;
            streak = 0;
            playSound('wrong');
            updateScoreUI();
            const currentQ = quizBank[currentQIndex];
            const allBtns = choicesGrid.querySelectorAll('.choice-btn');
            allBtns[currentQ.correct].classList.add('correct');
            allBtns.forEach(btn => btn.disabled = true);
            setTimeout(() => {
                currentQIndex++;
                loadNextQuestion();
            }, 1200);
        }

        function use5050() {
            if (used5050 || isAnswered || currentQIndex >= quizBank.length) return;
            used5050 = true;
            p5050.disabled = true;
            playSound('powerup');
            const currentQ = quizBank[currentQIndex];
            const allBtns = choicesGrid.querySelectorAll('.choice-btn');
            const wrongIndexes = Array.from(allBtns.keys()).filter(index => index !== currentQ.correct);
            wrongIndexes.sort(() => Math.random() - 0.5).slice(0, 2).forEach(index => {
                allBtns[index].style.opacity = '0.15';
                allBtns[index].disabled = true;
            });
        }

        function useFreeze() {
            if (usedFreeze || isAnswered || currentQIndex >= quizBank.length) return;
            usedFreeze = true;
            pFreeze.disabled = true;
            playSound('powerup');
            clearInterval(timerInterval);
            timerBar.style.background = '#00f0ff';
            timerBar.style.boxShadow = '0 0 15px #00f0ff';
        }

        function updateScoreUI() {
            scoreDisplay.textContent = `SCORE: ${score}`;
            streakDisplay.textContent = `🔥 ${streak} STREAK`;
        }

        function showFloatingText(text, targetEl, color) {
            const rect = targetEl.getBoundingClientRect();
            const floatEl = document.createElement('div');
            floatEl.className = 'float-score';
            floatEl.textContent = text;
            floatEl.style.color = color;
            floatEl.style.left = `${rect.left + rect.width / 2}px`;
            floatEl.style.top = `${rect.top}px`;
            document.body.appendChild(floatEl);
            setTimeout(() => floatEl.remove(), 800);
        }

        function endQuiz() {
            clearInterval(timerInterval);
            resultsOverlay.classList.remove('hidden');
            if (score > 1000) {
                resultTitle.textContent = '🏆 QUANTUM MASTER!';
            } else if (score > 500) {
                resultTitle.textContent = '⚡ IMPRESSIVE!';
            } else {
                resultTitle.textContent = '🚀 NOVICE RUNNER!';
            }
            resultText.innerHTML = `Final Score: <b>${score} Points</b><br>Max Streak: <b>${streak}</b>`;
        }
    </script>
    <script src="ambient-music.js"></script>
</body>
</html>
