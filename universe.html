<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Explore a scale-based interactive map of nearby stars, galaxies, and the observable universe." />
  <meta name="author" content="Parthiv" />
  <meta name="application-name" content="Parthiv Learning Hub" />
  <meta name="theme-color" content="#05072a" />
  <meta property="og:title" content="Observable Universe Map | Parthiv Learning Hub" />
  <meta property="og:description" content="Explore a scale-based interactive map of nearby stars, galaxies, and the observable universe." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://parthivcbn.github.io/pacheri-learning-hub/universe.html" />
  <meta property="og:site_name" content="Parthiv Learning Hub" />
  <link rel="canonical" href="https://parthivcbn.github.io/pacheri-learning-hub/universe.html" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <title>Observable Universe Map | Parthiv Learning Hub</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #dbeafe;
      background: #05072a;
    }

    * { box-sizing: border-box; }

    body {
      width: 100%;
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
      background: radial-gradient(ellipse at center, #10194a 0%, #05072a 72%);
    }

    .toolbar {
      position: fixed;
      z-index: 2;
      top: 16px;
      left: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: calc(100vw - 32px);
      padding: 12px;
      flex-wrap: wrap;
      background: rgba(10, 14, 36, 0.9);
      border: 1px solid rgba(125, 211, 252, 0.24);
      border-radius: 14px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
    }

    .toolbar a,
    .toolbar button,
    .toolbar select {
      min-height: 38px;
      padding: 8px 12px;
      border: 1px solid rgba(125, 211, 252, 0.3);
      border-radius: 8px;
      background: rgba(125, 211, 252, 0.08);
      color: #dbeafe;
      font: inherit;
    }

    .toolbar a {
      display: inline-flex;
      align-items: center;
      color: #7dd3fc;
      font-weight: 700;
      text-decoration: none;
    }

    .toolbar button { cursor: pointer; }
    .toolbar label { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
    .toolbar input { accent-color: #00d4ff; }
    :focus-visible { outline: 3px solid #7dd3fc; outline-offset: 2px; }

    .view,
    #universe { width: 100%; height: 100vh; }
    #universe { display: block; touch-action: none; }
    .ring { fill: none; stroke: rgba(125, 211, 252, 0.24); stroke-width: 1.25; }
    .galaxy { fill: #fff; opacity: 0.9; cursor: pointer; }
    .label { fill: #dbeafe; font-size: 12px; font-weight: 600; pointer-events: none; }

    .legend,
    .help {
      position: fixed;
      z-index: 1;
      padding: 10px 12px;
      border: 1px solid rgba(125, 211, 252, 0.2);
      border-radius: 10px;
      background: rgba(10, 14, 36, 0.88);
      color: #cbd5e1;
      font-size: 12px;
      line-height: 1.5;
      backdrop-filter: blur(8px);
    }

    .legend { top: 100px; right: 16px; }
    .help { bottom: 16px; left: 16px; }

    @media (max-width: 600px) {
      .toolbar { top: 10px; left: 10px; gap: 6px; padding: 8px; }
      .toolbar a, .toolbar button, .toolbar select { min-height: 34px; padding: 6px 8px; font-size: 12px; }
      .legend { top: auto; right: 10px; bottom: 10px; max-width: 52vw; }
      .help { left: 10px; bottom: 82px; max-width: 45vw; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <nav class="toolbar" aria-label="Universe map controls">
    <a href="home.html">← Learning Hub</a>
    <button id="resetBtn" type="button">Reset view</button>
    <label for="scaleMode">Scale
      <select id="scaleMode">
        <option value="log">Logarithmic</option>
        <option value="linear">Linear</option>
      </select>
    </label>
    <label for="labels"><input id="labels" type="checkbox" checked /> Show labels</label>
  </nav>

  <main class="view">
    <svg id="universe" viewBox="-500 -500 1000 1000" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="universeTitle universeDescription">
      <title id="universeTitle">Interactive map of the observable universe</title>
      <desc id="universeDescription">Distance rings and example stars and galaxies at different scales. Drag to pan and use the mouse wheel to zoom.</desc>
      <defs>
        <filter id="glow"><feGaussianBlur stdDeviation="2.2" result="blur" /><feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge></filter>
      </defs>
      <g id="rings"></g>
      <g id="galaxies"></g>
      <g id="labels"></g>
    </svg>
  </main>

  <aside class="legend" aria-label="Distance ring examples">
    <strong>Distance rings</strong><br />1 ly · 1k ly · 100k ly · 1M ly · 1B ly · 13.8B ly
  </aside>
  <p class="help">Zoom: mouse wheel · Pan: drag · Select an object for distance</p>

  <script src="universe.js" defer></script>
</body>
</html>
